<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="100%" height="100%">
  <defs>
    <linearGradient id="valBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061018"/>
      <stop offset="50%" stop-color="#081A26"/>
      <stop offset="100%" stop-color="#030910"/>
    </linearGradient>
    <linearGradient id="borderVal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="valGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0F2E3D" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
    <filter id="glowVal" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="860" height="210" rx="10" fill="url(#valBg)"/>
  <rect width="860" height="210" rx="10" fill="url(#valGrid)"/>
  <rect width="860" height="210" rx="10" fill="none" stroke="url(#borderVal)" stroke-width="1"/>

  <!-- Top Bar -->
  <rect x="20" y="16" width="12" height="12" rx="2" fill="#00F5FF" opacity="0.9"/>
  <text x="40" y="26" class="mono" font-size="10.5" font-weight="bold" fill="#00F5FF" letter-spacing="2">03 // SYSTEM: TRANSACTION VALIDATOR</text>
  
  <rect x="660" y="14" width="180" height="20" rx="4" fill="#030712" stroke="#00F5FF" stroke-width="0.6"/>
  <circle cx="672" cy="24" r="3" fill="#10B981" filter="url(#glowVal)"/>
  <text x="682" y="27" class="mono" font-size="8.5" fill="#00F5FF" letter-spacing="1.5">PROD DEPLOY // ACTIVE</text>

  <!-- Title and Description -->
  <text x="20" y="58" class="sans" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">High-Throughput CSV Data Pipeline &amp; Anomaly Engine</text>
  <text x="20" y="78" class="sans" font-size="11.5" fill="#94A3B8">Streamlined batch CSV parsing, syntax verification, duplicate transaction detection, and clean file export.</text>

  <!-- Architecture Flow Schematic -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="820" height="58" rx="6" fill="#040D15" stroke="#0E2A38" stroke-width="0.8"/>
    
    <!-- Stage 1 -->
    <rect x="12" y="10" width="160" height="38" rx="4" fill="#0A1C29" stroke="#00F5FF" stroke-width="0.7"/>
    <text x="22" y="24" class="mono" font-size="8" fill="#00F5FF">STAGE 01 // INGESTION</text>
    <text x="22" y="38" class="sans" font-size="10" font-weight="600" fill="#F8FAFC">Stream CSV Parsing</text>
    
    <path d="M 172 29 L 205 29" fill="none" stroke="#00F5FF" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Stage 2 -->
    <rect x="205" y="10" width="180" height="38" rx="4" fill="#0A1C29" stroke="#38BDF8" stroke-width="0.7"/>
    <text x="215" y="24" class="mono" font-size="8" fill="#38BDF8">STAGE 02 // SANITIZATION</text>
    <text x="215" y="38" class="sans" font-size="10" font-weight="600" fill="#F8FAFC">Syntax &amp; Type Auditing</text>
    
    <path d="M 385 29 L 418 29" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Stage 3 -->
    <rect x="418" y="10" width="180" height="38" rx="4" fill="#0A1C29" stroke="#10B981" stroke-width="0.7"/>
    <text x="428" y="24" class="mono" font-size="8" fill="#10B981">STAGE 03 // DETECTION</text>
    <text x="428" y="38" class="sans" font-size="10" font-weight="600" fill="#F8FAFC">Duplicate &amp; Anomaly Engine</text>

    <path d="M 598 29 L 631 29" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Stage 4 -->
    <rect x="631" y="10" width="177" height="38" rx="4" fill="#0A1C29" stroke="#00F5FF" stroke-width="0.7"/>
    <text x="641" y="24" class="mono" font-size="8" fill="#00F5FF">STAGE 04 // PIPELINE OUTPUT</text>
    <text x="641" y="38" class="sans" font-size="10" font-weight="600" fill="#F8FAFC">Clean Report Export</text>
  </g>

  <!-- Bottom Badges / Tech Specs -->
  <g transform="translate(20, 168)">
    <rect x="0" y="0" width="90" height="24" rx="4" fill="#030712" stroke="#0E2A38" stroke-width="0.6"/>
    <text x="45" y="16" class="mono" font-size="9" fill="#00F5FF" text-anchor="middle">Next.js App</text>

    <rect x="100" y="0" width="85" height="24" rx="4" fill="#030712" stroke="#0E2A38" stroke-width="0.6"/>
    <text x="142" y="16" class="mono" font-size="9" fill="#38BDF8" text-anchor="middle">TypeScript</text>

    <rect x="195" y="0" width="95" height="24" rx="4" fill="#030712" stroke="#0E2A38" stroke-width="0.6"/>
    <text x="242" y="16" class="mono" font-size="9" fill="#94A3B8" text-anchor="middle">Tailwind CSS</text>

    <rect x="300" y="0" width="110" height="24" rx="4" fill="#030712" stroke="#0E2A38" stroke-width="0.6"/>
    <text x="355" y="16" class="mono" font-size="9" fill="#10B981" text-anchor="middle">Data Algorithms</text>

    <rect x="420" y="0" width="65" height="24" rx="4" fill="#030712" stroke="#0E2A38" stroke-width="0.6"/>
    <text x="452" y="16" class="mono" font-size="9" fill="#10B981" text-anchor="middle">Vercel</text>

    <text x="500" y="16" class="mono" font-size="8" fill="#64748B">SIGNAL: High-efficiency CSV stream validation · duplicate isolating heuristics</text>
  </g>
</svg>