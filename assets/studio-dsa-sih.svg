    <line x1="443" y1="74" x2="816" y2="74" stroke="#1E293B" stroke-width="0.6"/>

    <text x="443" y="92" class="font-mono" font-size="8" fill="#94A3B8">• High-intensity agile collaboration &amp; system architecture design</text>
