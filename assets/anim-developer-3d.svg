<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <!-- Seamless Dark Background matching GitHub Dark (#0D1117) -->
    <radialGradient id="stageBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="60%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#080C12"/>
    </radialGradient>

    <!-- 3D Metallic Desk Gradients -->
    <linearGradient id="deskTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="deskFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- 3D Visor Curved Glass -->
    <linearGradient id="glassVisor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="35%" stop-color="#0284C7"/>
      <stop offset="85%" stop-color="#082F49"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- 3D Floating Isometric Cube Gradients -->
    <linearGradient id="cubeTopCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cubeSideCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>
    <linearGradient id="cubeTopPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cubeSidePurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <style>
    @keyframes floatRobot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCubeLeft {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes floatCubeRight {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(-3deg); }
    }
    @keyframes typeL {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes typeR {
      0%, 100% { transform: translateY(-4px); }
      50% { transform: translateY(0); }
    }
    @keyframes laserScan {
      0% { transform: translateY(-10px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(125px); opacity: 0; }
    }
    @keyframes blinkLed {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 2px #00F5FF); }
      50% { opacity: 0.25; }
    }
    .robot-body { animation: floatRobot 3.8s infinite ease-in-out; }
    .cube-l { animation: floatCubeLeft 4.2s infinite ease-in-out; }
    .cube-r { animation: floatCubeRight 4.6s infinite ease-in-out 0.4s; }
    .hand-left { animation: typeL 0.45s infinite ease-in-out; }
    .hand-right { animation: typeR 0.45s infinite ease-in-out 0.22s; }
    .scan-line { animation: laserScan 2.8s infinite linear; }
    .status-led { animation: blinkLed 1.6s infinite; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Courier New", monospace; }
  </style>

  <!-- Dark Mode Canvas Base -->
  <rect width="900" height="380" rx="14" fill="url(#stageBg)"/>
  <rect width="900" height="380" rx="14" fill="none" stroke="#1E293B" stroke-width="1.2"/>

  <!-- 3D Perspective Grid Floor -->
  <g stroke="#1E293B" stroke-width="0.8" opacity="0.4">
    <line x1="120" y1="360" x2="450" y2="245"/>
    <line x1="240" y1="380" x2="550" y2="265"/>
    <line x1="360" y1="380" x2="650" y2="265"/>
    <line x1="780" y1="360" x2="450" y2="245"/>
    <line x1="660" y1="380" x2="350" y2="265"/>
    <line x1="540" y1="380" x2="250" y2="265"/>
  </g>

  <!-- Ambient Floor Glow -->
  <ellipse cx="450" cy="330" rx="270" ry="24" fill="#00F5FF" opacity="0.08" filter="url(#dropShadow)"/>
  <ellipse cx="450" cy="315" rx="180" ry="16" fill="#818CF8" opacity="0.12" filter="url(#dropShadow)"/>

  <!-- ================= 3D ISOMETRIC WORKSTATION DESK ================= -->
  <g transform="translate(0, 0)">
    <!-- Desk Top Isometric Diamond -->
    <polygon points="450,225 760,285 450,340 140,285" fill="url(#deskTop)" stroke="#38BDF8" stroke-width="1"/>
    <!-- Desk Front Left Edge (3D Thickness) -->
    <polygon points="140,285 450,340 450,352 140,297" fill="url(#deskFront)" stroke="#1E293B" stroke-width="0.8"/>
    <!-- Desk Front Right Edge (3D Thickness) -->
    <polygon points="450,340 760,285 760,297 450,352" fill="url(#deskFront)" stroke="#1E293B" stroke-width="0.8"/>
    <!-- Neon Underglow Strip -->
    <line x1="145" y1="298" x2="450" y2="353" stroke="#00F5FF" stroke-width="2.5" opacity="0.75" filter="url(#laserGlow)"/>
    <line x1="450" y1="353" x2="755" y2="298" stroke="#00F5FF" stroke-width="2.5" opacity="0.75" filter="url(#laserGlow)"/>
  </g>

  <!-- ================= 3D FLOATING HOLOGRAPHIC CUBES ================= -->
  <!-- Left Floating 3D Cube: C++ Core -->
  <g transform="translate(100, 120)" class="cube-l">
    <ellipse cx="40" cy="90" rx="28" ry="7" fill="#000" opacity="0.4" filter="url(#dropShadow)"/>
    <polygon points="40,20 70,37 40,54 10,37" fill="url(#cubeTopCyan)"/>
    <polygon points="10,37 40,54 40,88 10,71" fill="url(#cubeSideCyan)"/>
    <polygon points="40,54 70,37 70,71 40,88" fill="#0284C7"/>
    <text x="40" y="42" class="mono" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">C++</text>
    <text x="40" y="73" class="mono" font-size="8.5" font-weight="bold" fill="#38BDF8" text-anchor="middle">500+</text>
  </g>

  <!-- Right Floating 3D Cube: Next.js & React -->
  <g transform="translate(720, 125)" class="cube-r">
    <ellipse cx="40" cy="90" rx="28" ry="7" fill="#000" opacity="0.4" filter="url(#dropShadow)"/>
    <polygon points="40,20 70,37 40,54 10,37" fill="url(#cubeTopPurple)"/>
    <polygon points="10,37 40,54 40,88 10,71" fill="url(#cubeSidePurple)"/>
    <polygon points="40,54 70,37 70,71 40,88" fill="#581C87"/>
    <text x="40" y="42" class="mono" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">FULL</text>
    <text x="40" y="73" class="mono" font-size="8" font-weight="bold" fill="#C084FC" text-anchor="middle">STACK</text>
  </g>

  <!-- ================= 3D CURVED MULTI-MONITOR SUITE ================= -->
  <!-- Center Main Curved Ultrawide Display -->
  <g transform="translate(285, 78)">
    <!-- Stand & Base -->
    <polygon points="145,175 185,175 195,210 135,210" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <ellipse cx="165" cy="210" rx="48" ry="8" fill="#030712" stroke="#38BDF8" stroke-width="0.8"/>
    <!-- Outer 3D Bezel -->
    <rect x="0" y="0" width="330" height="175" rx="8" fill="#0C1322" stroke="#38BDF8" stroke-width="1.4" filter="url(#laserGlow)"/>
    <rect x="5" y="5" width="320" height="165" rx="6" fill="#040914"/>
    <!-- Glass Specular Highlight -->
    <polygon points="5,5 130,5 25,170 5,170" fill="#FFF" opacity="0.035"/>

    <!-- Code Editor Window -->
    <g transform="translate(16, 18)">
      <circle cx="5" cy="5" r="3.5" fill="#EF4444"/>
      <circle cx="17" cy="5" r="3.5" fill="#F59E0B"/>
      <circle cx="29" cy="5" r="3.5" fill="#10B981"/>
      <text x="150" y="8" class="mono" font-size="8" fill="#64748B" text-anchor="middle">systems-engineer-core.tsx</text>

      <!-- Code Buffer -->
      <g transform="translate(0, 22)">
        <text x="5" y="12" class="mono" font-size="8.5" fill="#818CF8">const</text>
        <text x="42" y="12" class="mono" font-size="8.5" fill="#00F5FF">engineer</text>
        <text x="100" y="12" class="mono" font-size="8.5" fill="#FFF">= new</text>
        <text x="138" y="12" class="mono" font-size="8.5" fill="#10B981">SoftwareArchitect();</text>

        <text x="5" y="27" class="mono" font-size="8.5" fill="#818CF8">await</text>
        <text x="42" y="27" class="mono" font-size="8.5" fill="#FFF">engineer.deploy({</text>

        <text x="16" y="42" class="mono" font-size="8.5" fill="#94A3B8">frontend:</text>
        <text x="80" y="42" class="mono" font-size="8.5" fill="#F59E0B">"Next.js 14 / React / Tailwind",</text>

        <text x="16" y="57" class="mono" font-size="8.5" fill="#94A3B8">backend:</text>
        <text x="80" y="57" class="mono" font-size="8.5" fill="#F59E0B">"Node.js / PostgreSQL / Prisma",</text>

        <text x="16" y="72" class="mono" font-size="8.5" fill="#94A3B8">aiVoice:</text>
        <text x="80" y="72" class="mono" font-size="8.5" fill="#F59E0B">"Vapi AI Voice &amp; Gemini API",</text>

        <text x="16" y="87" class="mono" font-size="8.5" fill="#94A3B8">dsaMastery:</text>
        <text x="92" y="87" class="mono" font-size="8.5" fill="#10B981">"500+ C++ Algorithmic Invariants"</text>

        <text x="5" y="102" class="mono" font-size="8.5" fill="#FFF">});</text>

        <!-- Status Indicator Pill -->
        <rect x="5" y="112" width="145" height="15" rx="3" fill="#081A2A" stroke="#00F5FF" stroke-width="0.6"/>
        <circle cx="14" cy="119.5" r="2.5" fill="#10B981" class="status-led"/>
        <text x="24" y="123" class="mono" font-size="7.5" font-weight="bold" fill="#00F5FF">STATUS: SYSTEM READY</text>
      </g>
    </g>

    <!-- Scanning Laser Effect -->
    <line x1="5" y1="0" x2="325" y2="0" stroke="#00F5FF" stroke-width="1.2" opacity="0.5" class="scan-line"/>
  </g>

  <!-- Left Angled 3D Monitor -->
  <g transform="translate(160, 100)">
    <polygon points="105,5 0,26 0,146 105,156" fill="#070D18" stroke="#1E293B" stroke-width="1.2"/>
    <polygon points="100,12 8,30 8,141 100,150" fill="#040912"/>
    <line x1="18" y1="44" x2="90" y2="32" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
    <line x1="18" y1="58" x2="80" y2="48" stroke="#10B981" stroke-width="2" opacity="0.6"/>
    <line x1="18" y1="72" x2="85" y2="64" stroke="#818CF8" stroke-width="2" opacity="0.6"/>
    <line x1="18" y1="86" x2="70" y2="80" stroke="#94A3B8" stroke-width="2" opacity="0.6"/>
    <!-- Small Telemetry Chart -->
    <polyline points="18,130 35,118 52,124 72,108 88,114" fill="none" stroke="#00F5FF" stroke-width="1.5"/>
  </g>

  <!-- Right Angled 3D Monitor -->
  <g transform="translate(635, 100)">
    <polygon points="0,5 105,26 105,146 0,156" fill="#070D18" stroke="#1E293B" stroke-width="1.2"/>
    <polygon points="5,12 97,30 97,141 5,150" fill="#040912"/>
    <!-- Activity Chart -->
    <polyline points="15,95 35,80 55,90 75,60 90,65" fill="none" stroke="#C084FC" stroke-width="1.8"/>
    <polygon points="15,95 35,80 55,90 75,60 90,65 90,130 15,130" fill="#C084FC" opacity="0.15"/>
    <text x="52" y="124" class="mono" font-size="7.5" fill="#A78BFA" text-anchor="middle">STREAK: 250d+</text>
  </g>

  <!-- 3D Perspective Holographic Keyboard -->
  <g transform="translate(335, 268)">
    <polygon points="75,0 155,0 205,32 25,32" fill="#091322" stroke="#00F5FF" stroke-width="0.8" opacity="0.85"/>
    <line x1="35" y1="8" x2="195" y2="8" stroke="#00F5FF" stroke-width="0.8" opacity="0.4"/>
    <line x1="30" y1="16" x2="200" y2="16" stroke="#00F5FF" stroke-width="0.8" opacity="0.4"/>
    <line x1="25" y1="24" x2="205" y2="24" stroke="#00F5FF" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- ================= 3D VOLUMETRIC ROBOT DEVELOPER ================= -->
  <g transform="translate(450, 168)" class="robot-body">
    <!-- Shadow Underneath Robot -->
    <ellipse cx="0" cy="125" rx="60" ry="14" fill="#000" opacity="0.5" filter="url(#dropShadow)"/>

    <!-- Dual Shoulder Mounts -->
    <rect x="-68" y="34" width="15" height="24" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
    <circle cx="-60" cy="40" r="2.5" fill="#00F5FF" class="status-led"/>
    <rect x="53" y="34" width="15" height="24" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
    <circle cx="61" cy="40" r="2.5" fill="#00F5FF" class="status-led"/>

    <!-- 3D Torso Armor (Volumetric Shading) -->
    <path d="M -45 40 L 45 40 L 34 95 L -34 95 Z" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.2"/>
    <polygon points="-40,42 40,42 30,75 -30,75" fill="#1E293B"/>
    <!-- Glowing Arc Reactor Core -->
    <polygon points="0,50 11,63 0,76 -11,63" fill="#00F5FF" filter="url(#laserGlow)"/>
    <polygon points="0,54 7,63 0,72 -7,63" fill="#FFFFFF"/>

    <!-- Articulated 3D Shoulders -->
    <circle cx="-45" cy="44" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
    <circle cx="45" cy="44" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>

    <!-- Left Mechanical Arm & Typing Hand -->
    <g class="hand-left">
      <path d="M -45 48 Q -70 80 -42 108 Q -28 118 -16 114" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/>
      <path d="M -45 48 Q -70 80 -42 108 Q -28 118 -16 114" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-16" cy="114" r="6.5" fill="#00F5FF" filter="url(#laserGlow)"/>
      <circle cx="-16" cy="114" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Right Mechanical Arm & Typing Hand -->
    <g class="hand-right">
      <path d="M 45 48 Q 70 80 42 108 Q 28 118 16 114" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/>
      <path d="M 45 48 Q 70 80 42 108 Q 28 118 16 114" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="16" cy="114" r="6.5" fill="#00F5FF" filter="url(#laserGlow)"/>
      <circle cx="16" cy="114" r="4" fill="#FFFFFF"/>
    </g>

    <!-- 3D Volumetric Spherical Helmet -->
    <g transform="translate(0, -12)">
      <!-- Antenna -->
      <line x1="0" y1="-30" x2="0" y2="-12" stroke="#64748B" stroke-width="2.5"/>
      <circle cx="0" cy="-30" r="4" fill="#00F5FF" class="status-led"/>

      <!-- Helmet Shell -->
      <rect x="-38" y="-12" width="76" height="54" rx="20" fill="#1E293B" stroke="#38BDF8" stroke-width="1.4" filter="url(#laserGlow)"/>
      <!-- Side Ear Pucks -->
      <rect x="-44" y="4" width="8" height="22" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="0.8"/>
      <rect x="36" y="4" width="8" height="22" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="0.8"/>

      <!-- 3D Curved Visor Glass -->
      <rect x="-30" y="-1" width="60" height="30" rx="11" fill="#020814" stroke="#00F5FF" stroke-width="1"/>
      <rect x="-27" y="2" width="54" height="24" rx="8" fill="url(#glassVisor)"/>
      <!-- Visor Specular Reflection Highlight -->
      <path d="M -22 5 Q 0 1 22 5" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85" stroke-linecap="round"/>
      <!-- Focus Reticle Eyes -->
      <circle cx="-9" cy="14" r="3.5" fill="#FFFFFF" class="status-led"/>
      <circle cx="9" cy="14" r="3.5" fill="#FFFFFF" class="status-led"/>
    </g>
  </g>

  <!-- Bottom Status Plaque -->
  <g transform="translate(450, 362)">
    <rect x="-210" y="-14" width="420" height="22" rx="11" fill="#081424" stroke="#00F5FF" stroke-width="0.8"/>
    <circle cx="-195" cy="-3" r="3.5" fill="#10B981" class="status-led"/>
    <text x="0" y="1" class="mono" font-size="9" font-weight="bold" fill="#00F5FF" text-anchor="middle" letter-spacing="2">⚡ ACTIVE WORKSTATION // AMAN DUBEY • SOFTWARE ENGINEER</text>
  </g>
</svg>
