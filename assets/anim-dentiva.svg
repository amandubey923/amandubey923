<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="dentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="50%" stop-color="#120B24"/>
      <stop offset="100%" stop-color="#06030F"/>
    </linearGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="dentGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 3px #8B5CF6); }
      50% { filter: drop-shadow(0 0 8px #00F5FF); }
    }
    @keyframes waveLeft {
      0% { opacity: 0; transform: translateX(0); }
      50% { opacity: 0.8; }
      100% { opacity: 0; transform: translateX(-8px); }
    }
    @keyframes waveRight {
      0% { opacity: 0; transform: translateX(0); }
      50% { opacity: 0.8; }
      100% { opacity: 0; transform: translateX(8px); }
    }
    @keyframes ecgFlow {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    .tooth-glow { animation: pulseGlow 2.5s infinite ease-in-out; }
    .voice-left { animation: waveLeft 1.6s infinite ease-in-out; }
    .voice-right { animation: waveRight 1.6s infinite ease-in-out; }
    .ecg-line { stroke-dasharray: 80; animation: ecgFlow 2s infinite linear; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>

  <rect width="500" height="130" rx="10" fill="url(#dentBg)" stroke="#2E1065" stroke-width="1"/>

  <!-- Left Side: Stethoscope Tube & Doctor Cross -->
  <g transform="translate(60, 35)">
    <!-- Medical Cross -->
    <rect x="25" y="5" width="20" height="6" rx="2" fill="#8B5CF6"/>
    <rect x="32" y="-2" width="6" height="20" rx="2" fill="#8B5CF6"/>
    <!-- Stethoscope Arch Curve -->
    <path d="M 15 50 C 15 25 55 25 55 50" fill="none" stroke="#4C1D95" stroke-width="2.5"/>
    <circle cx="15" cy="50" r="3.5" fill="#A78BFA"/>
    <circle cx="55" cy="50" r="3.5" fill="#A78BFA"/>
    <path d="M 35 37 L 35 65" fill="none" stroke="#4C1D95" stroke-width="2.5"/>
    <circle cx="35" cy="65" r="5" fill="#00F5FF" class="tooth-glow"/>
  </g>

  <!-- Central Animated Tooth & Voice Soundwaves -->
  <g transform="translate(250, 52)">
    <!-- Left Radiating Voice AI Waves -->
    <path d="M -36 -12 A 20 20 0 0 0 -36 18" fill="none" stroke="#00F5FF" stroke-width="1.8" stroke-linecap="round" class="voice-left"/>
    <path d="M -46 -18 A 28 28 0 0 0 -46 24" fill="none" stroke="#8B5CF6" stroke-width="1.8" stroke-linecap="round" class="voice-left" opacity="0.6"/>

    <!-- The Dental Tooth (Accurate Dental Anatomy Shape) -->
    <path d="M 0 -24 
             C 12 -28 22 -14 20 2 
             C 18 16 14 26 10 32 
             C 6 22 2 18 0 18 
             C -2 18 -6 22 -10 32 
             C -14 26 -18 16 -20 2 
             C -22 -14 -12 -28 0 -24 Z" 
          fill="url(#toothGrad)" 
          stroke="#A78BFA" 
          stroke-width="1.2" 
          class="tooth-glow"/>

    <!-- Tooth Enamel Reflection Highlight -->
    <path d="M -11 -16 C -7 -22 -2 -22 0 -22 C -6 -20 -10 -16 -12 -12 Z" fill="#FFFFFF" opacity="0.8"/>

    <!-- Right Radiating Voice AI Waves -->
    <path d="M 36 -12 A 20 20 0 0 1 36 18" fill="none" stroke="#00F5FF" stroke-width="1.8" stroke-linecap="round" class="voice-right"/>
    <path d="M 46 -18 A 28 28 0 0 1 46 24" fill="none" stroke="#8B5CF6" stroke-width="1.8" stroke-linecap="round" class="voice-right" opacity="0.6"/>
  </g>

  <!-- Right Side: Animated Clinical Heartbeat ECG Line -->
  <g transform="translate(360, 42)">
    <rect x="-10" y="-8" width="80" height="35" rx="4" fill="#130B29" stroke="#2E1065" stroke-width="0.8"/>
    <path d="M -5 10 L 15 10 L 22 -4 L 28 24 L 34 2 L 40 14 L 46 10 L 65 10" fill="none" stroke="#00F5FF" stroke-width="1.5" stroke-linecap="round" class="ecg-line"/>
    <circle cx="28" cy="24" r="2.5" fill="#EF4444"/>
    <text x="28" y="38" class="font-mono" font-size="7.5" fill="#A78BFA" text-anchor="middle">TRIAGE LIVE</text>
  </g>

  <!-- Caption text -->
  <text x="250" y="112" class="font-mono" font-size="9" fill="#94A3B8" text-anchor="middle" letter-spacing="1">VOICE-DRIVEN DENTAL SYMPTOM TRIAGE &amp; PRISMA BOOKING</text>
</svg>
