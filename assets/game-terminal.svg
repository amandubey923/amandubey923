<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <filter id="termGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes termBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes lineFade {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
    .term-code { font-family: ui-monospace, SFMono-Regular, "Courier New", monospace; font-size: 11.5px; }
    .term-cursor { animation: termBlink 1s infinite; fill: #00F5FF; }
  </style>

  <!-- Terminal Window Frame -->
  <rect width="920" height="230" rx="10" fill="url(#termBg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Window Header Bar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 910 0 C 915.523 0 920 4.477 920 10 L 920 32 L 0 32 Z" fill="#0A111E"/>
  <line x1="0" y1="32" x2="920" y2="32" stroke="#1E293B" stroke-width="0.8"/>

  <!-- Window Controls (Red, Yellow, Green) -->
  <circle cx="20" cy="16" r="4.5" fill="#EF4444"/>
  <circle cx="36" cy="16" r="4.5" fill="#F59E0B"/>
  <circle cx="52" cy="16" r="4.5" fill="#10B981"/>

  <text x="460" y="20" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B" text-anchor="middle" letter-spacing="1">root@amandubey-core: ~/missions/quest-engine.sh</text>
  <text x="895" y="20" font-family="ui-monospace, monospace" font-size="8.5" fill="#38BDF8" text-anchor="end">TERMINAL_ACTIVE</text>

  <!-- Terminal Output Stream -->
  <g transform="translate(24, 52)">
    <!-- Command 1 -->
    <text x="0" y="14" class="term-code" fill="#38BDF8" font-weight="bold">$</text>
    <text x="18" y="14" class="term-code" fill="#F8FAFC">whoami --verbose</text>
    <text x="0" y="32" class="term-code" fill="#94A3B8">&gt;&gt; OPERATOR: Aman Dubey // Full-Stack Software Engineer &amp; Systems Builder</text>

    <!-- Command 2 -->
    <text x="0" y="54" class="term-code" fill="#38BDF8" font-weight="bold">$</text>
    <text x="18" y="54" class="term-code" fill="#F8FAFC">cat /etc/core-invariants.json</text>
    <text x="0" y="72" class="term-code" fill="#94A3B8">&gt;&gt; LOADED: Next.js 14+ • TypeScript • PostgreSQL • Prisma • Convex • Vapi Voice AI • C++ STL</text>

    <!-- Command 3 -->
    <text x="0" y="94" class="term-code" fill="#38BDF8" font-weight="bold">$</text>
    <text x="18" y="94" class="term-code" fill="#F8FAFC">status --check-buffs</text>
    <text x="0" y="112" class="term-code" fill="#10B981">&gt;&gt; [PASS] 500+ Algorithmic Runes Solved | 250+ Days Streak | SIH National Participant | CGPA 8.17</text>

    <!-- Command 4 & Blinking Cursor -->
    <text x="0" y="134" class="term-code" fill="#38BDF8" font-weight="bold">$</text>
    <text x="18" y="134" class="term-code" fill="#F8FAFC">mission --objective "Build scalable, zero-shift reactive systems with intelligent AI"</text>
    <text x="0" y="152" class="term-code" fill="#00F5FF">&gt;&gt; STATUS: MULTIPLAYER CO-OP READY // OPEN FOR SOFTWARE ENGINEERING ROLES</text>
    
    <rect x="525" y="140" width="7" height="13" class="term-cursor"/>
  </g>
</svg>
