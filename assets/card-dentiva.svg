<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="100%" height="100%">
  <defs>
    <linearGradient id="dentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0916"/>
      <stop offset="50%" stop-color="#140E26"/>
      <stop offset="100%" stop-color="#06040F"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>

  <rect width="880" height="210" rx="10" fill="url(#dentGrad)" stroke="#2E1065" stroke-width="1"/>

  <!-- Top Bar -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="80" height="20" rx="4" fill="#4C1D95" fill-opacity="0.3" stroke="#8B5CF6" stroke-width="0.6"/>
    <text x="40" y="13.5" class="font-mono" font-size="8.5" font-weight="700" fill="#A78BFA" text-anchor="middle">BUILD 02</text>
    <text x="95" y="14" class="font-mono" font-size="10" font-weight="700" fill="#F8FAFC" letter-spacing="1">DENTIVA AI</text>
    
    <text x="832" y="14" class="font-mono" font-size="8.5" fill="#10B981" text-anchor="end">● PRODUCTION ACTIVE</text>
  </g>

  <!-- Title & Description -->
  <g transform="translate(24, 52)">
    <text x="0" y="16" class="font-sans" font-size="16" font-weight="800" fill="#FFFFFF">AI Dental Clinical Assistant &amp; Voice Triage</text>
    <text x="0" y="36" class="font-sans" font-size="11.5" fill="#94A3B8">Built conversational AI voice consultation for symptom assessment, doctor appointment booking with slot selection, and Prisma/PostgreSQL store.</text>
  </g>

  <!-- Architecture Flow -->
  <g transform="translate(24, 105)">
    <rect x="0" y="0" width="832" height="48" rx="6" fill="#090514" stroke="#2E1065" stroke-width="0.7"/>
    
    <rect x="10" y="8" width="180" height="32" rx="4" fill="#130B29"/>
    <text x="20" y="21" class="font-mono" font-size="7.5" fill="#A78BFA">SECURITY LAYER</text>
    <text x="20" y="33" class="font-sans" font-size="9.5" font-weight="600" fill="#F8FAFC">Clerk RBAC Auth</text>

    <path d="M 190 24 L 215 24" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2,2"/>

    <rect x="215" y="8" width="185" height="32" rx="4" fill="#130B29"/>
    <text x="225" y="21" class="font-mono" font-size="7.5" fill="#A78BFA">DATABASE</text>
    <text x="225" y="33" class="font-sans" font-size="9.5" font-weight="600" fill="#F8FAFC">Prisma ORM + Postgres</text>

    <path d="M 400 24 L 425 24" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2,2"/>

    <rect x="425" y="8" width="190" height="32" rx="4" fill="#130B29"/>
    <text x="435" y="21" class="font-mono" font-size="7.5" fill="#A78BFA">SCHEDULING</text>
    <text x="435" y="33" class="font-sans" font-size="9.5" font-weight="600" fill="#F8FAFC">Real-Time Slot Engine</text>

    <path d="M 615 24 L 640 24" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2,2"/>

    <rect x="640" y="8" width="182" height="32" rx="4" fill="#130B29"/>
    <text x="650" y="21" class="font-mono" font-size="7.5" fill="#10B981">INTELLIGENCE</text>
    <text x="650" y="33" class="font-sans" font-size="9.5" font-weight="600" fill="#F8FAFC">Vapi Voice Triage Agent</text>
  </g>

  <!-- Badges -->
  <g transform="translate(24, 168)">
    <rect x="0" y="0" width="80" height="22" rx="4" fill="#100A20" stroke="#2E1065" stroke-width="0.6"/>
    <text x="40" y="15" class="font-mono" font-size="8.5" fill="#A78BFA" text-anchor="middle">Next.js</text>

    <rect x="90" y="0" width="90" height="22" rx="4" fill="#100A20" stroke="#2E1065" stroke-width="0.6"/>
    <text x="135" y="15" class="font-mono" font-size="8.5" fill="#A78BFA" text-anchor="middle">TypeScript</text>

    <rect x="190" y="0" width="95" height="22" rx="4" fill="#100A20" stroke="#2E1065" stroke-width="0.6"/>
    <text x="237" y="15" class="font-mono" font-size="8.5" fill="#38BDF8" text-anchor="middle">PostgreSQL</text>

    <rect x="295" y="0" width="85" height="22" rx="4" fill="#100A20" stroke="#2E1065" stroke-width="0.6"/>
    <text x="337" y="15" class="font-mono" font-size="8.5" fill="#94A3B8" text-anchor="middle">Prisma</text>

    <rect x="390" y="0" width="75" height="22" rx="4" fill="#100A20" stroke="#2E1065" stroke-width="0.6"/>
    <text x="427" y="15" class="font-mono" font-size="8.5" fill="#A78BFA" text-anchor="middle">Vapi AI</text>

    <text x="490" y="15" class="font-mono" font-size="8" fill="#64748B">ENGINEERING SIGNAL: Type-safe clinical appointments paired with conversational voice triage</text>
  </g>
</svg>