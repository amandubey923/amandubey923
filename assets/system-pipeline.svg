<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0C1322"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="pipeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="pipeGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="860" height="210" rx="10" fill="url(#pipeBg)"/>
  <rect width="860" height="210" rx="10" fill="url(#pipeGrid)"/>
  <rect width="860" height="210" rx="10" fill="none" stroke="url(#pipeBorder)" stroke-width="1"/>

  <!-- Header -->
  <rect x="20" y="16" width="12" height="12" rx="2" fill="#00F5FF" opacity="0.9"/>
  <text x="40" y="26" class="mono" font-size="10.5" font-weight="bold" fill="#00F5FF" letter-spacing="2">SYS_ARCH // END-TO-END ENGINEERING PIPELINE</text>
  <text x="840" y="26" class="mono" font-size="9" fill="#64748B" text-anchor="end" letter-spacing="1.5">SPEC ➔ PRODUCTION ➔ IMPACT</text>

  <!-- 5-Stage Pipeline Cards -->
  <g transform="translate(20, 50)">
    <!-- Stage 01 -->
    <rect x="0" y="0" width="150" height="135" rx="6" fill="#0A101D" stroke="#00F5FF" stroke-width="0.8"/>
    <rect x="8" y="8" width="24" height="16" rx="2" fill="#00F5FF" fill-opacity="0.1" stroke="#00F5FF" stroke-width="0.5"/>
    <text x="20" y="19" class="mono" font-size="8" font-weight="bold" fill="#00F5FF" text-anchor="middle">01</text>
    <text x="38" y="19" class="mono" font-size="8.5" fill="#00F5FF" font-weight="bold">SPEC &amp; LOGIC</text>
    <line x1="8" y1="30" x2="142" y2="30" stroke="#1E293B" stroke-width="0.6"/>
    <text x="10" y="48" class="sans" font-size="11" font-weight="700" fill="#FFFFFF">Foundations</text>
    <text x="10" y="68" class="mono" font-size="8.5" fill="#94A3B8">• Problem Breakdown</text>
    <text x="10" y="84" class="mono" font-size="8.5" fill="#94A3B8">• C++ / Algorithms</text>
    <text x="10" y="100" class="mono" font-size="8.5" fill="#94A3B8">• Asymptotic Proofs</text>
    <text x="10" y="116" class="mono" font-size="8" fill="#64748B">500+ Solved Core</text>

    <!-- Arrow 1 -->
    <path d="M 150 67 L 168 67" fill="none" stroke="#00F5FF" stroke-width="1.2" stroke-dasharray="2,2"/>
    <polygon points="168,67 163,64 163,70" fill="#00F5FF"/>

    <!-- Stage 02 -->
    <rect x="168" y="0" width="150" height="135" rx="6" fill="#0A101D" stroke="#38BDF8" stroke-width="0.8"/>
    <rect x="176" y="8" width="24" height="16" rx="2" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-width="0.5"/>
    <text x="188" y="19" class="mono" font-size="8" font-weight="bold" fill="#38BDF8" text-anchor="middle">02</text>
    <text x="206" y="19" class="mono" font-size="8.5" fill="#38BDF8" font-weight="bold">INTERFACE</text>
    <line x1="176" y1="30" x2="310" y2="30" stroke="#1E293B" stroke-width="0.6"/>
    <text x="178" y="48" class="sans" font-size="11" font-weight="700" fill="#FFFFFF">User Experience</text>
    <text x="178" y="68" class="mono" font-size="8.5" fill="#94A3B8">• Next.js App Router</text>
    <text x="178" y="84" class="mono" font-size="8.5" fill="#94A3B8">• React Components</text>
    <text x="178" y="100" class="mono" font-size="8.5" fill="#94A3B8">• Tailwind Styling</text>
    <text x="178" y="116" class="mono" font-size="8" fill="#64748B">Responsive &amp; Fast</text>

    <!-- Arrow 2 -->
    <path d="M 318 67 L 336 67" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2,2"/>
    <polygon points="336,67 331,64 331,70" fill="#38BDF8"/>

    <!-- Stage 03 -->
    <rect x="336" y="0" width="150" height="135" rx="6" fill="#0A101D" stroke="#818CF8" stroke-width="0.8"/>
    <rect x="344" y="8" width="24" height="16" rx="2" fill="#818CF8" fill-opacity="0.1" stroke="#818CF8" stroke-width="0.5"/>
    <text x="356" y="19" class="mono" font-size="8" font-weight="bold" fill="#818CF8" text-anchor="middle">03</text>
    <text x="374" y="19" class="mono" font-size="8.5" fill="#818CF8" font-weight="bold">RUNTIME &amp; DATA</text>
    <line x1="344" y1="30" x2="478" y2="30" stroke="#1E293B" stroke-width="0.6"/>
    <text x="346" y="48" class="sans" font-size="11" font-weight="700" fill="#FFFFFF">Backend Systems</text>
    <text x="346" y="68" class="mono" font-size="8.5" fill="#94A3B8">• Node.js &amp; Express</text>
    <text x="346" y="84" class="mono" font-size="8.5" fill="#94A3B8">• PostgreSQL &amp; Prisma</text>
    <text x="346" y="100" class="mono" font-size="8.5" fill="#94A3B8">• MongoDB &amp; Convex</text>
    <text x="346" y="116" class="mono" font-size="8" fill="#64748B">Type-Safe Boundaries</text>

    <!-- Arrow 3 -->
    <path d="M 486 67 L 504 67" fill="none" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="2,2"/>
    <polygon points="504,67 499,64 499,70" fill="#818CF8"/>

    <!-- Stage 04 -->
    <rect x="504" y="0" width="150" height="135" rx="6" fill="#0A101D" stroke="#C084FC" stroke-width="0.8"/>
    <rect x="512" y="8" width="24" height="16" rx="2" fill="#C084FC" fill-opacity="0.1" stroke="#C084FC" stroke-width="0.5"/>
    <text x="524" y="19" class="mono" font-size="8" font-weight="bold" fill="#C084FC" text-anchor="middle">04</text>
    <text x="542" y="19" class="mono" font-size="8.5" fill="#C084FC" font-weight="bold">INTELLIGENCE</text>
    <line x1="512" y1="30" x2="646" y2="30" stroke="#1E293B" stroke-width="0.6"/>
    <text x="514" y="48" class="sans" font-size="11" font-weight="700" fill="#FFFFFF">AI &amp; Integrations</text>
    <text x="514" y="68" class="mono" font-size="8.5" fill="#94A3B8">• Gemini LLM Engine</text>
    <text x="514" y="84" class="mono" font-size="8.5" fill="#94A3B8">• Vapi Voice Agents</text>
    <text x="514" y="100" class="mono" font-size="8.5" fill="#94A3B8">• Clerk Auth Layer</text>
    <text x="514" y="116" class="mono" font-size="8" fill="#64748B">Domain Workflows</text>

    <!-- Arrow 4 -->
    <path d="M 654 67 L 672 67" fill="none" stroke="#C084FC" stroke-width="1.2" stroke-dasharray="2,2"/>
    <polygon points="672,67 667,64 667,70" fill="#C084FC"/>

    <!-- Stage 05 -->
    <rect x="672" y="0" width="148" height="135" rx="6" fill="#0A101D" stroke="#10B981" stroke-width="0.8"/>
    <rect x="680" y="8" width="24" height="16" rx="2" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="0.5"/>
    <text x="692" y="19" class="mono" font-size="8" font-weight="bold" fill="#10B981" text-anchor="middle">05</text>
    <text x="710" y="19" class="mono" font-size="8.5" fill="#10B981" font-weight="bold">DEPLOY &amp; VALUE</text>
    <line x1="680" y1="30" x2="812" y2="30" stroke="#1E293B" stroke-width="0.6"/>
    <text x="682" y="48" class="sans" font-size="11" font-weight="700" fill="#FFFFFF">Production</text>
    <text x="682" y="68" class="mono" font-size="8.5" fill="#94A3B8">• Vercel / Netlify</text>
    <text x="682" y="84" class="mono" font-size="8.5" fill="#94A3B8">• CI/CD Automation</text>
    <text x="682" y="100" class="mono" font-size="8.5" fill="#94A3B8">• Resilient Delivery</text>
    <text x="682" y="116" class="mono" font-size="8" fill="#10B981">Active &amp; Scalable</text>
  </g>
</svg>