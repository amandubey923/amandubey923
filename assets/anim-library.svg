<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="libBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060E1A"/>
      <stop offset="50%" stop-color="#0B172B"/>
      <stop offset="100%" stop-color="#040912"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="libGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes flipPage {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(0.2); }
    }
    @keyframes sparkRise1 {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-35px); opacity: 0; }
    }
    @keyframes sparkRise2 {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-40px); opacity: 0; }
    }
    @keyframes searchPulse {
      0%, 100% { stroke: #38BDF8; filter: drop-shadow(0 0 2px #38BDF8); }
      50% { stroke: #10B981; filter: drop-shadow(0 0 6px #10B981); }
    }
    .page-turn { transform-origin: 250px 60px; animation: flipPage 2.8s infinite ease-in-out; }
    .spark-1 { animation: sparkRise1 2.2s infinite ease-in-out; }
    .spark-2 { animation: sparkRise2 2.6s infinite ease-in-out 0.8s; }
    .search-lens { animation: searchPulse 2s infinite ease-in-out; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>

  <rect width="500" height="130" rx="10" fill="url(#libBg)" stroke="#1E293B" stroke-width="1"/>

  <!-- Left Bookshelf Silhouettes -->
  <g transform="translate(30, 30)">
    <rect x="0" y="20" width="10" height="50" rx="2" fill="#1E293B"/>
    <rect x="13" y="10" width="12" height="60" rx="2" fill="#0369A1" opacity="0.8"/>
    <rect x="28" y="25" width="9" height="45" rx="2" fill="#1E293B"/>
    <rect x="40" y="5" width="14" height="65" rx="2" fill="#0284C7" opacity="0.6"/>
    <line x1="-5" y1="70" x2="60" y2="70" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Right Bookshelf Silhouettes -->
  <g transform="translate(410, 30)">
    <rect x="0" y="15" width="12" height="55" rx="2" fill="#0284C7" opacity="0.6"/>
    <rect x="15" y="5" width="10" height="65" rx="2" fill="#1E293B"/>
    <rect x="28" y="20" width="14" height="50" rx="2" fill="#0369A1" opacity="0.8"/>
    <rect x="45" y="30" width="9" height="40" rx="2" fill="#1E293B"/>
    <line x1="-5" y1="70" x2="60" y2="70" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Central Holographic Open Book -->
  <g transform="translate(0, 0)">
    <!-- Book Base Glow -->
    <ellipse cx="250" cy="85" rx="55" ry="10" fill="#0284C7" opacity="0.25" filter="url(#libGlow)"/>

    <!-- Left Open Page -->
    <path d="M 250 80 Q 215 75 180 82 L 180 48 Q 215 42 250 48 Z" fill="#0F1F38" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="192" y1="56" x2="238" y2="52" stroke="#64748B" stroke-width="1"/>
    <line x1="192" y1="64" x2="235" y2="60" stroke="#64748B" stroke-width="1"/>
    <line x1="192" y1="72" x2="225" y2="68" stroke="#64748B" stroke-width="1"/>

    <!-- Right Open Page -->
    <path d="M 250 80 Q 285 75 320 82 L 320 48 Q 285 42 250 48 Z" fill="#0F1F38" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="262" y1="52" x2="308" y2="56" stroke="#64748B" stroke-width="1"/>
    <line x1="262" y1="60" x2="305" y2="64" stroke="#64748B" stroke-width="1"/>
    <line x1="262" y1="68" x2="295" y2="72" stroke="#64748B" stroke-width="1"/>

    <!-- Animated Turning Page in the Center -->
    <path d="M 250 80 Q 265 72 280 78 L 280 44 Q 265 38 250 48 Z" fill="#0284C7" opacity="0.6" class="page-turn"/>

    <!-- Book Spine Center Line -->
    <line x1="250" y1="46" x2="250" y2="82" stroke="#00F5FF" stroke-width="2"/>

    <!-- Floating Sparks / Knowledge Particles -->
    <circle cx="235" cy="45" r="2" fill="#00F5FF" class="spark-1"/>
    <circle cx="265" cy="40" r="2.5" fill="#10B981" class="spark-2"/>
    <circle cx="250" cy="30" r="1.8" fill="#38BDF8" class="spark-1"/>
  </g>

  <!-- Search Radar Beam / Magnifying Glyph -->
  <g transform="translate(340, 32)">
    <circle cx="15" cy="15" r="8" fill="none" stroke="#38BDF8" stroke-width="1.8" class="search-lens"/>
    <line x1="21" y1="21" x2="29" y2="29" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" class="search-lens"/>
  </g>

  <!-- Caption text -->
  <text x="250" y="112" class="font-mono" font-size="9" fill="#94A3B8" text-anchor="middle" letter-spacing="1">CATALOG INDEXING &amp; REAL-TIME READER STATE ENGINE</text>
</svg>
