<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0B1322"/>
      <stop offset="100%" stop-color="#04070E"/>
    </linearGradient>
    <linearGradient id="cBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="cGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
    <filter id="cGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="860" height="230" rx="10" fill="url(#cBg)"/>
  <rect width="860" height="230" rx="10" fill="url(#cGrid)"/>
  <rect width="860" height="230" rx="10" fill="none" stroke="url(#cBorder)" stroke-width="1"/>

  <!-- Top Bar -->
  <rect x="20" y="14" width="12" height="12" rx="2" fill="#00F5FF" opacity="0.9"/>
  <text x="40" y="24" class="mono" font-size="10.5" font-weight="bold" fill="#00F5FF" letter-spacing="2">ECOSYSTEM // PRODUCTION PROJECT CONSTELLATION</text>
  <text x="840" y="24" class="mono" font-size="9" fill="#8B5CF6" text-anchor="end" letter-spacing="1.5">6 PRODUCTION SYSTEMS</text>

  <!-- Left: AI Systems Cluster -->
  <g transform="translate(20, 42)">
    <rect x="0" y="0" width="395" height="125" rx="6" fill="#0C0E1E" stroke="#8B5CF6" stroke-width="0.8"/>
    <rect x="10" y="8" width="115" height="16" rx="3" fill="#1B133B" stroke="#8B5CF6" stroke-width="0.6"/>
    <circle cx="20" cy="16" r="3" fill="#A78BFA" filter="url(#cGlow)"/>
    <text x="28" y="20" class="mono" font-size="8" font-weight="bold" fill="#C084FC">AI &amp; VOICE PLATFORMS</text>
    
    <!-- Node 1: Dentiva AI -->
    <rect x="10" y="32" width="115" height="82" rx="4" fill="#070914" stroke="#8B5CF6" stroke-width="0.6"/>
    <text x="18" y="47" class="mono" font-size="8" fill="#A78BFA">01 // CLINICAL AI</text>
    <text x="18" y="63" class="sans" font-size="10.5" font-weight="bold" fill="#FFFFFF">Dentiva AI</text>
    <text x="18" y="78" class="mono" font-size="7.5" fill="#94A3B8">Vapi · Prisma</text>
    <text x="18" y="90" class="mono" font-size="7.5" fill="#94A3B8">PostgreSQL</text>
    <text x="18" y="104" class="mono" font-size="7" fill="#10B981">● Live Clinical Triage</text>

    <!-- Node 2: AI Fitness -->
    <rect x="140" y="32" width="115" height="82" rx="4" fill="#070914" stroke="#8B5CF6" stroke-width="0.6"/>
    <text x="148" y="47" class="mono" font-size="8" fill="#A78BFA">02 // HEALTH AI</text>
    <text x="148" y="63" class="sans" font-size="10.5" font-weight="bold" fill="#FFFFFF">AI Fitness</text>
    <text x="148" y="78" class="mono" font-size="7.5" fill="#94A3B8">Gemini · Convex</text>
    <text x="148" y="90" class="mono" font-size="7.5" fill="#94A3B8">Clerk · Vapi</text>
    <text x="148" y="104" class="mono" font-size="7" fill="#10B981">● Live Biometrics</text>

    <!-- Node 3: Image Studio -->
    <rect x="270" y="32" width="115" height="82" rx="4" fill="#070914" stroke="#8B5CF6" stroke-width="0.6"/>
    <text x="278" y="47" class="mono" font-size="8" fill="#A78BFA">03 // CREATIVE AI</text>
    <text x="278" y="63" class="sans" font-size="10.5" font-weight="bold" fill="#FFFFFF">Image Studio</text>
    <text x="278" y="78" class="mono" font-size="7.5" fill="#94A3B8">Diffusion API</text>
    <text x="278" y="90" class="mono" font-size="7.5" fill="#94A3B8">Next.js · Tailwind</text>
    <text x="278" y="104" class="mono" font-size="7" fill="#10B981">● Live Studio</text>
  </g>

  <!-- Right: Product & Data Systems Cluster -->
  <g transform="translate(445, 42)">
    <rect x="0" y="0" width="395" height="125" rx="6" fill="#081420" stroke="#00F5FF" stroke-width="0.8"/>
    <rect x="10" y="8" width="135" height="16" rx="3" fill="#0E2333" stroke="#00F5FF" stroke-width="0.6"/>
    <circle cx="20" cy="16" r="3" fill="#00F5FF" filter="url(#cGlow)"/>
    <text x="28" y="20" class="mono" font-size="8" font-weight="bold" fill="#00F5FF">PRODUCT &amp; DATA SYSTEMS</text>

    <!-- Node 4: Reader's HUB -->
    <rect x="10" y="32" width="115" height="82" rx="4" fill="#040B13" stroke="#00F5FF" stroke-width="0.6"/>
    <text x="18" y="47" class="mono" font-size="8" fill="#00F5FF">04 // ECOSYSTEM</text>
    <text x="18" y="63" class="sans" font-size="10.5" font-weight="bold" fill="#FFFFFF">Reader's HUB</text>
    <text x="18" y="78" class="mono" font-size="7.5" fill="#94A3B8">Next.js · TS</text>
    <text x="18" y="90" class="mono" font-size="7.5" fill="#94A3B8">Query Cache</text>
    <text x="18" y="104" class="mono" font-size="7" fill="#10B981">● Live Library</text>

    <!-- Node 5: Productify -->
    <rect x="140" y="32" width="115" height="82" rx="4" fill="#040B13" stroke="#00F5FF" stroke-width="0.6"/>
    <text x="148" y="47" class="mono" font-size="8" fill="#00F5FF">05 // SAAS COMMERCE</text>
    <text x="148" y="63" class="sans" font-size="10.5" font-weight="bold" fill="#FFFFFF">Productify</text>
    <text x="148" y="78" class="mono" font-size="7.5" fill="#94A3B8">MongoDB · Node</text>
    <text x="148" y="90" class="mono" font-size="7.5" fill="#94A3B8">Express · React</text>
    <text x="148" y="104" class="mono" font-size="7" fill="#10B981">● Live SaaS</text>

    <!-- Node 6: Transaction Validator -->
    <rect x="270" y="32" width="115" height="82" rx="4" fill="#040B13" stroke="#00F5FF" stroke-width="0.6"/>
    <text x="278" y="47" class="mono" font-size="8" fill="#00F5FF">06 // DATA PIPELINE</text>
    <text x="278" y="63" class="sans" font-size="10.5" font-weight="bold" fill="#FFFFFF">Tx Validator</text>
    <text x="278" y="78" class="mono" font-size="7.5" fill="#94A3B8">Stream CSV</text>
    <text x="278" y="90" class="mono" font-size="7.5" fill="#94A3B8">Anomaly Logic</text>
    <text x="278" y="104" class="mono" font-size="7" fill="#10B981">● Live Engine</text>
  </g>

  <!-- Bottom Unifying Hub -->
  <g transform="translate(20, 178)">
    <rect x="0" y="0" width="820" height="38" rx="6" fill="#070C16" stroke="#1E293B" stroke-width="0.8"/>
    <circle cx="25" cy="19" r="4" fill="#00F5FF" filter="url(#cGlow)"/>
    <text x="38" y="23" class="mono" font-size="9" font-weight="bold" fill="#00F5FF" letter-spacing="1">FULL-STACK CORE</text>
    <text x="165" y="23" class="mono" font-size="8.5" fill="#64748B">├──</text>
    <text x="190" y="23" class="mono" font-size="8.5" fill="#94A3B8">High-Concurrency React/Next Interfaces</text>
    <text x="440" y="23" class="mono" font-size="8.5" fill="#64748B">├──</text>
    <text x="465" y="23" class="mono" font-size="8.5" fill="#94A3B8">Type-Safe Relational &amp; Document Data</text>
    <text x="705" y="23" class="mono" font-size="8.5" fill="#64748B">└──</text>
    <text x="730" y="23" class="mono" font-size="8.5" fill="#10B981">500+ DSA Core</text>
  </g>
</svg>