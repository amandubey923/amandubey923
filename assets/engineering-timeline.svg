<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="100%" height="100%">
  <defs>
    <linearGradient id="timeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0A1120"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>
    <linearGradient id="timeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="timeGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="860" height="170" rx="10" fill="url(#timeBg)"/>
  <rect width="860" height="170" rx="10" fill="url(#timeGrid)"/>
  <rect width="860" height="170" rx="10" fill="none" stroke="url(#timeBorder)" stroke-width="1"/>

  <!-- Top Header -->
  <rect x="20" y="14" width="12" height="12" rx="2" fill="#00F5FF" opacity="0.9"/>
  <text x="40" y="24" class="mono" font-size="10.5" font-weight="bold" fill="#00F5FF" letter-spacing="2">CHRONOLOGY // ENGINEERING MILESTONES &amp; TRAJECTORY</text>
  <text x="840" y="24" class="mono" font-size="9" fill="#10B981" text-anchor="end" letter-spacing="1">CONTINUOUS EVOLUTION</text>

  <!-- Main Timeline Bar -->
  <g transform="translate(20, 50)">
    <line x1="30" y1="20" x2="790" y2="20" stroke="#1E293B" stroke-width="2"/>
    <line x1="30" y1="20" x2="790" y2="20" stroke="#00F5FF" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.7"/>

    <!-- Milestone 1 -->
    <circle cx="60" cy="20" r="7" fill="#08101E" stroke="#00F5FF" stroke-width="2"/>
    <circle cx="60" cy="20" r="3" fill="#00F5FF"/>
    <text x="60" y="45" class="mono" font-size="8.5" font-weight="bold" fill="#00F5FF" text-anchor="middle">500+ DSA CORE</text>
    <text x="60" y="60" class="sans" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">C++ Foundations</text>
    <text x="60" y="74" class="mono" font-size="8" fill="#64748B" text-anchor="middle">LeetCode · GFG</text>
    <text x="60" y="86" class="mono" font-size="7.5" fill="#94A3B8" text-anchor="middle">Asymptotic Mastery</text>

    <!-- Milestone 2 -->
    <circle cx="280" cy="20" r="7" fill="#08101E" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="280" cy="20" r="3" fill="#38BDF8"/>
    <text x="280" y="45" class="mono" font-size="8.5" font-weight="bold" fill="#38BDF8" text-anchor="middle">FULL-STACK SYSTEMS</text>
    <text x="280" y="60" class="sans" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">Production Web Apps</text>
    <text x="280" y="74" class="mono" font-size="8" fill="#64748B" text-anchor="middle">Next.js · React · Node</text>
    <text x="280" y="86" class="mono" font-size="7.5" fill="#94A3B8" text-anchor="middle">PostgreSQL · MongoDB</text>

    <!-- Milestone 3 -->
    <circle cx="510" cy="20" r="7" fill="#08101E" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="510" cy="20" r="3" fill="#8B5CF6"/>
    <text x="510" y="45" class="mono" font-size="8.5" font-weight="bold" fill="#A78BFA" text-anchor="middle">SIH PARTICIPANT</text>
    <text x="510" y="60" class="sans" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">National Hackathon</text>
    <text x="510" y="74" class="mono" font-size="8" fill="#64748B" text-anchor="middle">Smart India Hackathon</text>
    <text x="510" y="86" class="mono" font-size="7.5" fill="#94A3B8" text-anchor="middle">Agile System Delivery</text>

    <!-- Milestone 4 -->
    <circle cx="740" cy="20" r="7" fill="#08101E" stroke="#10B981" stroke-width="2"/>
    <circle cx="740" cy="20" r="3" fill="#10B981"/>
    <text x="740" y="45" class="mono" font-size="8.5" font-weight="bold" fill="#10B981" text-anchor="middle">AI PLATFORMS (NOW)</text>
    <text x="740" y="60" class="sans" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">AI &amp; Voice Workflows</text>
    <text x="740" y="74" class="mono" font-size="8" fill="#64748B" text-anchor="middle">Gemini · Vapi · Convex</text>
    <text x="740" y="86" class="mono" font-size="7.5" fill="#10B981" text-anchor="middle">Production Scalability</text>
  </g>
</svg>