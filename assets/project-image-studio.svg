<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="100%" height="100%">
  <defs>
    <linearGradient id="imgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120B1C"/>
      <stop offset="50%" stop-color="#1C0F2D"/>
      <stop offset="100%" stop-color="#08040F"/>
    </linearGradient>
    <linearGradient id="borderImg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="imgGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#37123C" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
    <filter id="glowImg" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="860" height="210" rx="10" fill="url(#imgBg)"/>
  <rect width="860" height="210" rx="10" fill="url(#imgGrid)"/>
  <rect width="860" height="210" rx="10" fill="none" stroke="url(#borderImg)" stroke-width="1"/>

  <!-- Top Bar -->
  <rect x="20" y="16" width="12" height="12" rx="2" fill="#EC4899" opacity="0.9"/>
  <text x="40" y="26" class="mono" font-size="10.5" font-weight="bold" fill="#F472B6" letter-spacing="2">05 // SYSTEM: AI IMAGE GENERATOR STUDIO</text>
  
  <rect x="660" y="14" width="180" height="20" rx="4" fill="#030712" stroke="#EC4899" stroke-width="0.6"/>
  <circle cx="672" cy="24" r="3" fill="#10B981" filter="url(#glowImg)"/>
  <text x="682" y="27" class="mono" font-size="8.5" fill="#F472B6" letter-spacing="1.5">PROD DEPLOY // ACTIVE</text>

  <!-- Title and Description -->
  <text x="20" y="58" class="sans" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Creative Diffusion Studio &amp; Generative Canvas</text>
  <text x="20" y="78" class="sans" font-size="11.5" fill="#94A3B8">Transform text prompts into distinctive visual aesthetics, preset style engines, and high-resolution generation pipelines.</text>

  <!-- Architecture Flow Schematic -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="820" height="58" rx="6" fill="#0C0513" stroke="#37123C" stroke-width="0.8"/>
    
    <!-- Stage 1 -->
    <rect x="12" y="10" width="160" height="38" rx="4" fill="#1D0A24" stroke="#EC4899" stroke-width="0.7"/>
    <text x="22" y="24" class="mono" font-size="8" fill="#F472B6">STAGE 01 // PROMPT ENGINE</text>
    <text x="22" y="38" class="sans" font-size="10" font-weight="600" fill="#F8FAFC">Style &amp; Negative Ingest</text>
    
    <path d="M 172 29 L 205 29" fill="none" stroke="#EC4899" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Stage 2 -->
    <rect x="205" y="10" width="180" height="38" rx="4" fill="#1D0A24" stroke="#8B5CF6" stroke-width="0.7"/>
    <text x="215" y="24" class="mono" font-size="8" fill="#A78BFA">STAGE 02 // PIPELINE</text>
    <text x="215" y="38" class="sans" font-size="10" font-weight="600" fill="#F8FAFC">Diffusion Model Inference</text>
    
    <path d="M 385 29 L 418 29" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Stage 3 -->
    <rect x="418" y="10" width="180" height="38" rx="4" fill="#1D0A24" stroke="#38BDF8" stroke-width="0.7"/>
    <text x="428" y="24" class="mono" font-size="8" fill="#38BDF8">STAGE 03 // POST-PROCESS</text>
    <text x="428" y="38" class="sans" font-size="10" font-weight="600" fill="#F8FAFC">Image Upscale &amp; Buffer</text>

    <path d="M 598 29 L 631 29" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Stage 4 -->
    <rect x="631" y="10" width="177" height="38" rx="4" fill="#1D0A24" stroke="#EC4899" stroke-width="0.7"/>
    <text x="641" y="24" class="mono" font-size="8" fill="#F472B6">STAGE 04 // GALLERY</text>
    <text x="641" y="38" class="sans" font-size="10" font-weight="600" fill="#F8FAFC">Client Export &amp; Render</text>
  </g>

  <!-- Bottom Badges / Tech Specs -->
  <g transform="translate(20, 168)">
    <rect x="0" y="0" width="85" height="24" rx="4" fill="#030712" stroke="#37123C" stroke-width="0.6"/>
    <text x="42" y="16" class="mono" font-size="9" fill="#F472B6" text-anchor="middle">React.js</text>

    <rect x="95" y="0" width="85" height="24" rx="4" fill="#030712" stroke="#37123C" stroke-width="0.6"/>
    <text x="137" y="16" class="mono" font-size="9" fill="#A78BFA" text-anchor="middle">TypeScript</text>

    <rect x="190" y="0" width="95" height="24" rx="4" fill="#030712" stroke="#37123C" stroke-width="0.6"/>
    <text x="237" y="16" class="mono" font-size="9" fill="#94A3B8" text-anchor="middle">Tailwind CSS</text>

    <rect x="295" y="0" width="110" height="24" rx="4" fill="#030712" stroke="#37123C" stroke-width="0.6"/>
    <text x="350" y="16" class="mono" font-size="9" fill="#F472B6" text-anchor="middle">Diffusion API</text>

    <text x="420" y="16" class="mono" font-size="8" fill="#64748B">SIGNAL: Asynchronous generation stream &amp; real-time canvas rendering</text>
  </g>
</svg>