<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="100%" height="100%">
  <defs>
    <linearGradient id="dsaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E18"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="dsaBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="dsaGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
    <filter id="glowDSA" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="860" height="190" rx="10" fill="url(#dsaBg)"/>
  <rect width="860" height="190" rx="10" fill="url(#dsaGrid)"/>
  <rect width="860" height="190" rx="10" fill="none" stroke="url(#dsaBorder)" stroke-width="1"/>

  <!-- Top Header -->
  <rect x="20" y="14" width="12" height="12" rx="2" fill="#10B981" opacity="0.9"/>
  <text x="40" y="24" class="mono" font-size="10.5" font-weight="bold" fill="#10B981" letter-spacing="2">06 // ALGORITHMIC FOUNDATIONS &amp; PROBLEM SOLVING</text>
  <text x="840" y="24" class="mono" font-size="9" fill="#00F5FF" text-anchor="end" letter-spacing="1">LEETCODE &amp; GEEKSFORGEEKS</text>

  <!-- 3 Pillar Stat Cards -->
  <g transform="translate(20, 42)">
    <!-- Card 1: 500+ Metric -->
    <rect x="0" y="0" width="260" height="132" rx="6" fill="#090E1A" stroke="#00F5FF" stroke-width="0.8"/>
    <rect x="12" y="10" width="65" height="16" rx="2" fill="#00F5FF" fill-opacity="0.1" stroke="#00F5FF" stroke-width="0.5"/>
    <text x="44" y="21" class="mono" font-size="8" fill="#00F5FF" font-weight="bold" text-anchor="middle">BENCHMARK</text>
    
    <text x="14" y="58" class="sans" font-size="28" font-weight="900" fill="#FFFFFF">500+</text>
    <text x="100" y="55" class="mono" font-size="10" font-weight="bold" fill="#00F5FF">PROBLEMS</text>
    <text x="100" y="67" class="mono" font-size="8" fill="#64748B">SOLVED &amp; VERIFIED</text>
    
    <line x1="12" y1="76" x2="248" y2="76" stroke="#1E293B" stroke-width="0.6"/>
    
    <text x="14" y="94" class="mono" font-size="8.5" fill="#94A3B8">• LeetCode &amp; GeeksforGeeks</text>
    <text x="14" y="108" class="mono" font-size="8.5" fill="#94A3B8">• Asymptotic Optimization (Time/Space)</text>
    <text x="14" y="122" class="mono" font-size="8" fill="#38BDF8">Consistent engineering discipline</text>

    <!-- Card 2: Core Language & CS Foundations -->
    <rect x="280" y="0" width="260" height="132" rx="6" fill="#090E1A" stroke="#8B5CF6" stroke-width="0.8"/>
    <rect x="292" y="10" width="75" height="16" rx="2" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="0.5"/>
    <text x="329" y="21" class="mono" font-size="8" fill="#C084FC" font-weight="bold" text-anchor="middle">CORE ENGINE</text>
    
    <text x="294" y="58" class="sans" font-size="24" font-weight="900" fill="#FFFFFF">C++</text>
    <text x="348" y="55" class="mono" font-size="9.5" font-weight="bold" fill="#A78BFA">ALGORITHMIC</text>
    <text x="348" y="67" class="mono" font-size="8" fill="#64748B">SYSTEM RUNTIME</text>

    <line x1="292" y1="76" x2="528" y2="76" stroke="#1E293B" stroke-width="0.6"/>
    
    <text x="294" y="94" class="mono" font-size="8.5" fill="#94A3B8">• Arrays, Strings, Hashing</text>
    <text x="294" y="108" class="mono" font-size="8.5" fill="#94A3B8">• Binary Trees, Graphs &amp; Traversals</text>
    <text x="294" y="122" class="mono" font-size="8" fill="#A78BFA">Recursion · Dynamic Programming</text>

    <!-- Card 3: SIH & Collaborative Engineering -->
    <rect x="560" y="0" width="260" height="132" rx="6" fill="#090E1A" stroke="#10B981" stroke-width="0.8"/>
    <rect x="572" y="10" width="85" height="16" rx="2" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="0.5"/>
    <text x="614" y="21" class="mono" font-size="8" fill="#10B981" font-weight="bold" text-anchor="middle">HACKATHON</text>

    <text x="574" y="58" class="sans" font-size="22" font-weight="900" fill="#FFFFFF">SIH</text>
    <text x="624" y="55" class="mono" font-size="9.5" font-weight="bold" fill="#10B981">PARTICIPANT</text>
    <text x="624" y="67" class="mono" font-size="8" fill="#64748B">SMART INDIA HACKATHON</text>

    <line x1="572" y1="76" x2="808" y2="76" stroke="#1E293B" stroke-width="0.6"/>

    <text x="574" y="94" class="mono" font-size="8.5" fill="#94A3B8">• National hackathon problem track</text>
    <text x="574" y="108" class="mono" font-size="8.5" fill="#94A3B8">• Agile sprints &amp; system architecture</text>
    <text x="574" y="122" class="mono" font-size="8" fill="#10B981">Rapid prototyping under pressure</text>
  </g>
</svg>