<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="100%" height="100%">
  <defs>
    <linearGradient id="prodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1017"/>
      <stop offset="50%" stop-color="#0F1B2A"/>
      <stop offset="100%" stop-color="#05090F"/>
    </linearGradient>
    <linearGradient id="borderProd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00F5FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="prodGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#132E47" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
    <filter id="glowProd" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="860" height="210" rx="10" fill="url(#prodBg)"/>
  <rect width="860" height="210" rx="10" fill="url(#prodGrid)"/>
  <rect width="860" height="210" rx="10" fill="none" stroke="url(#borderProd)" stroke-width="1"/>

  <!-- Top Bar -->
  <rect x="20" y="16" width="12" height="12" rx="2" fill="#38BDF8" opacity="0.9"/>
  <text x="40" y="26" class="mono" font-size="10.5" font-weight="bold" fill="#38BDF8" letter-spacing="2">06 // SYSTEM: PRODUCTIFY SAAS PLATFORM</text>
  
  <rect x="660" y="14" width="180" height="20" rx="4" fill="#030712" stroke="#38BDF8" stroke-width="0.6"/>
  <circle cx="672" cy="24" r="3" fill="#10B981" filter="url(#glowProd)"/>
  <text x="682" y="27" class="mono" font-size="8.5" fill="#38BDF8" letter-spacing="1.5">PROD DEPLOY // ACTIVE</text>

  <!-- Title and Description -->
  <text x="20" y="58" class="sans" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Digital Creator Storefront &amp; Asset SaaS Engine</text>
  <text x="20" y="78" class="sans" font-size="11.5" fill="#94A3B8">Scalable digital marketplace with secure asset uploads, categorization schemas, and high-performance MongoDB store.</text>

  <!-- Architecture Flow Schematic -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="820" height="58" rx="6" fill="#061019" stroke="#132E47" stroke-width="0.8"/>
    
    <!-- Stage 1 -->
    <rect x="12" y="10" width="160" height="38" rx="4" fill="#0D2033" stroke="#38BDF8" stroke-width="0.7"/>
    <text x="22" y="24" class="mono" font-size="8" fill="#38BDF8">STAGE 01 // STOREFRONT</text>
    <text x="22" y="38" class="sans" font-size="10" font-weight="600" fill="#F8FAFC">Responsive React UI</text>
    
    <path d="M 172 29 L 205 29" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Stage 2 -->
    <rect x="205" y="10" width="180" height="38" rx="4" fill="#0D2033" stroke="#00F5FF" stroke-width="0.7"/>
    <text x="215" y="24" class="mono" font-size="8" fill="#00F5FF">STAGE 02 // SERVER LAYER</text>
    <text x="215" y="38" class="sans" font-size="10" font-weight="600" fill="#F8FAFC">Node / Express REST APIs</text>
    
    <path d="M 385 29 L 418 29" fill="none" stroke="#00F5FF" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Stage 3 -->
    <rect x="418" y="10" width="180" height="38" rx="4" fill="#0D2033" stroke="#10B981" stroke-width="0.7"/>
    <text x="428" y="24" class="mono" font-size="8" fill="#10B981">STAGE 03 // PERSISTENCE</text>
    <text x="428" y="38" class="sans" font-size="10" font-weight="600" fill="#F8FAFC">MongoDB Atlas Clusters</text>

    <path d="M 598 29 L 631 29" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Stage 4 -->
    <rect x="631" y="10" width="177" height="38" rx="4" fill="#0D2033" stroke="#38BDF8" stroke-width="0.7"/>
    <text x="641" y="24" class="mono" font-size="8" fill="#38BDF8">STAGE 04 // ASSET PIPELINE</text>
    <text x="641" y="38" class="sans" font-size="10" font-weight="600" fill="#F8FAFC">Secure Showcase &amp; CDN</text>
  </g>

  <!-- Bottom Badges / Tech Specs -->
  <g transform="translate(20, 168)">
    <rect x="0" y="0" width="85" height="24" rx="4" fill="#030712" stroke="#132E47" stroke-width="0.6"/>
    <text x="42" y="16" class="mono" font-size="9" fill="#38BDF8" text-anchor="middle">React.js</text>

    <rect x="95" y="0" width="85" height="24" rx="4" fill="#030712" stroke="#132E47" stroke-width="0.6"/>
    <text x="137" y="16" class="mono" font-size="9" fill="#00F5FF" text-anchor="middle">Node.js</text>

    <rect x="190" y="0" width="85" height="24" rx="4" fill="#030712" stroke="#132E47" stroke-width="0.6"/>
    <text x="232" y="16" class="mono" font-size="9" fill="#10B981" text-anchor="middle">MongoDB</text>

    <rect x="285" y="0" width="85" height="24" rx="4" fill="#030712" stroke="#132E47" stroke-width="0.6"/>
    <text x="327" y="16" class="mono" font-size="9" fill="#94A3B8" text-anchor="middle">Express</text>

    <text x="390" y="16" class="mono" font-size="8" fill="#64748B">SIGNAL: Full-stack creator marketplace · asset upload &amp; categorisation</text>
  </g>
</svg>