      <stop offset="40%" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
