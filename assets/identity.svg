<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 46" width="100%" height="100%">
  <defs>
    <linearGradient id="idGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="bgPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#110E24"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; fill: #00F5FF; }
      50% { opacity: 0.3; fill: #8B5CF6; }
    }
    .live-dot { animation: pulse-dot 2s infinite ease-in-out; }
  </style>

  <rect width="740" height="46" rx="8" fill="url(#bgPill)" stroke="#1E293B" stroke-width="1"/>
  
  <circle cx="24" cy="23" r="4" class="live-dot"/>
  <text x="38" y="27" class="mono" font-size="11" font-weight="bold" fill="#00F5FF" letter-spacing="1.5">FULL-STACK SOFTWARE ENGINEER</text>
  <text x="345" y="27" class="mono" font-size="11" fill="#64748B">//</text>
  <text x="365" y="27" class="mono" font-size="11" font-weight="bold" fill="#A78BFA" letter-spacing="1.5">SYSTEMS ARCHITECT</text>
  <text x="545" y="27" class="mono" font-size="11" fill="#64748B">//</text>
  <text x="565" y="27" class="mono" font-size="11" font-weight="bold" fill="#38BDF8" letter-spacing="1.5">500+ DSA (C++)</text>
</svg>