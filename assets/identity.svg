<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 42" role="img" aria-label="Full-stack developer, product builder, and systems learner">
  <rect width="920" height="42" rx="6" fill="#0B0F17" stroke="#00F5FF" stroke-opacity=".32"/>
  <circle cx="24" cy="21" r="4" fill="#00F5FF"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="#DDE7F8">
    <text x="44" y="26">IDENTITY /</text>
    <text x="170" y="26" fill="#00F5FF" opacity="1">FULL-STACK DEVELOPER<animate attributeName="opacity" values="1;1;0;0;0;0;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="170" y="26" fill="#C4B5FD" opacity="0">PRODUCT BUILDER<animate attributeName="opacity" values="0;0;1;1;0;0;0" dur="9s" repeatCount="indefinite"/></text>
    <text x="170" y="26" fill="#00F5FF" opacity="0">SYSTEMS LEARNER<animate attributeName="opacity" values="0;0;0;0;1;1;0" dur="9s" repeatCount="indefinite"/></text>
  </g>
</svg>
